services:
  messenger:
    build:
      context: .
      dockerfile: Dockerfile.service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - messenger-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  messenger-data:
